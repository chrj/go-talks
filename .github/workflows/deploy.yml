name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Let one run finish before the next starts. Then an older run cannot finish
# last and replace a newer version of the site.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The race detector needs cgo, which setup-go leaves on.
      - name: Run tests
        run: go test -race ./...

      - name: Render the talks
        run: go run ./cmd/render

      - name: Collect the site files
        run: cp _headers public/

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
