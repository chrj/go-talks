name: Security (Daily)

on:
  schedule:
    - cron: "0 23 * * *" # 11pm UTC (6pm EST / 7pm EDT)
  workflow_dispatch:

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  govulncheck:
    name: "Go: Vulnerability Check"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Run govulncheck
        run: |
          GOTOOLCHAIN=auto go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck -show verbose ./...

  semgrep:
    name: "Semgrep: Full Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Semgrep
        run: python -m pip install semgrep==1.171.0

      # The files under 2017/ are the code of the talks. They teach a point,
      # and some of them show a password or a server without a timeout. A
      # scan of them reports the talk, not the site.
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/golang \
            --config p/security-audit \
            --exclude 2017 \
            --error \
            --sarif --output semgrep.sarif

      - name: Upload SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif

  gosec:
    name: "gosec: Full Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      # gosec reads the files, not the build list, so the ignore directive in
      # go.mod does not keep it away from the code of the talks.
      - name: Run gosec
        run: |
          GOTOOLCHAIN=auto go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          gosec -exclude-generated -exclude-dir=2017 ./...
